[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apostate"
version = "0.4.0"
description = "Patchright-compatible Python interface for the Apostate native Chromium build"
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{name = "Apostate contributors"}]
# Patchright is required, not optional: the launcher drives it, and a package
# that needs a second `pip install` before it can do anything is not installed.
# 1.55 is the first release whose persistent context belongs to a Browser, which
# launch() needs (Playwright 1.53 made that change; Patchright skipped 1.53 and
# 1.54). It pins pyee>=13,<14 and greenlet>=3.1.1,<4, which are exactly the
# ranges playwright pins, so installing both resolves one of each and a user
# who already has Playwright is not broken. It is a fork rather than a plugin,
# so it does not depend on playwright itself.
dependencies = ["patchright>=1.55"]

[project.optional-dependencies]
# The alternative driver, for a caller who wants `driver="playwright"`. Neither
# driver needs `playwright install`: Apostate supplies its own browser.
playwright = ["playwright>=1.53"]

[project.scripts]
apostate = "apostate.cli:main"

[project.urls]
Homepage = "https://github.com/heretic-tech/apostate"
Source = "https://github.com/heretic-tech/apostate"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apostate*"]

[tool.setuptools.package-data]
apostate = ["assets/*.json"]
