name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to rebuild and publish"
        required: true
        type: string
      confirm:
        description: "Confirm this manual release; each run is a multi-hour paid build"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apostate-build
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  release-gate:
    name: version tag and pre-release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            [ "$CONFIRMATION" = true ] || { echo "workflow_dispatch requires confirm=true" >&2; exit 1; }
            tag="$REQUESTED_TAG"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release must use a version tag such as v1.2.3" >&2
            exit 1
          }
          # No GPG verification. The trust root is push access to this
          # repository -- the same one that authorises the workflow file
          # itself -- and artifact provenance is attested by GitHub against
          # the commit. Verifying a tag signature here would also fail
          # closed on every hosted runner, because none has the signer's
          # public key in its keyring.
          git fetch --force --tags origin
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git checkout --detach "refs/tags/$tag"
          fi
          revision="$(git rev-parse HEAD)"
          [ "$revision" = "$(git rev-parse "refs/tags/$tag^{commit}")" ] || {
            echo "checked out revision is not the tag target" >&2
            exit 1
          }
          printf 'tag=%s\nrevision=%s\n' "$tag" "$revision" >> "$GITHUB_OUTPUT"
      - name: Validate release baseline
        shell: bash
        run: |
          set -euo pipefail
          for path in scripts/validate-release-baseline.py build/CHROMIUM_VERSION build/MANIFEST.lock patches/series; do
            test -f "$path" || { echo "missing release gate input: $path" >&2; exit 1; }
          done
          # --release makes a stale build record fatal. MANIFEST.lock is
          # generated by a build, so between builds its two patch digests
          # trail the tree and the everyday check reports that as a notice.
          # At a tag the recorded output hashes are about to be published as
          # evidence for this exact patch set, so here it has to fail.
          python3 scripts/validate-release-baseline.py --root . --release
      - name: Run resolver checks
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/test_profile_resolver.py
          test -f resources/profiles/catalogue.json
          # The golden profile digests were produced by the C++ compositor, so
          # only a build can refresh them. Everyday runs skip them with the
          # reason printed; a tag must not ship a resolver whose agreement
          # with the native compositor has never been checked at this
          # catalogue revision. See docs/RELEASE.md.
          APOSTATE_REQUIRE_NATIVE_GOLDENS=1 python3 scripts/test_profile_resolver.py
      - name: Run Python package tests
        shell: bash
        run: |
          set -euo pipefail
          test -d python/tests
          python3 -m unittest discover python/tests
      - name: Run Node package tests
        shell: bash
        run: |
          set -euo pipefail
          test -f npm/package.json
          test -f npm/package-lock.json
          test -d npm/test
          # Without this the run resolves no dependencies at all; see the
          # same step in check.yml.
          npm ci --prefix npm
          npm --prefix npm test

  setup:
    name: resolve available build targets
    needs: release-gate
    if: ${{ needs.release-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release-gate.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve target matrix
        id: resolve
        env:
          CONFIGURED_TARGETS: ${{ vars.APOSTATE_BUILD_TARGETS }}
        shell: bash
        run: bash scripts/resolve-build-targets.sh >> "$GITHUB_OUTPUT"
      - name: Report resolved targets
        env:
          RESOLVED_TARGETS: ${{ steps.resolve.outputs.targets }}
        shell: bash
        run: printf 'building %s\n' "$RESOLVED_TARGETS"

  build:
    name: release
    needs:
      - release-gate
      - setup
    if: ${{ needs.release-gate.result == 'success' && needs.setup.result == 'success' }}
    # Grants what the attestation needs. The keypair is minted by Sigstore for
    # this run from the OIDC token and discarded, which is why no signing
    # secret is passed to the reusable workflow any more.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # All targets concurrently. Each leg is its own ephemeral VM and WarpBuild
    # imposes no concurrency limit, so serializing only lengthens the release
    # without saving anything. fail-fast is the cost control: a release is dead
    # the moment any target fails, and cancelling the siblings immediately
    # stops their spend.
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/build-target.yml
    with:
      target: ${{ matrix.target }}
      runner_labels: ${{ matrix.runner_labels }}
      attest: true
      ref: ${{ needs.release-gate.outputs.tag }}
      artifact_prefix: release
      retention_days: 7
    # The macOS leg signs and notarizes with these; the other three targets
    # ignore them. Named rather than `inherit` so the reusable workflow is
    # handed exactly the six it declares. A repository that has not set them
    # yet passes empty strings and still gets an unsigned macOS archive.
    secrets:
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

  publish:
    name: verify all artifacts and publish release
    needs:
      - release-gate
      - setup
      - build
    if: ${{ needs.release-gate.result == 'success' && needs.setup.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged release policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release-gate.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify release policy inputs
        shell: bash
        run: |
          set -euo pipefail
          for path in .github/release/artifact-policy.json scripts/validate-release-contract.py scripts/verify-release-inputs.sh release/manifest.schema.json resources/profiles/catalogue.json; do
            test -f "$path" || { echo "missing release verification input: $path" >&2; exit 1; }
          done
          python3 - <<'PY'
          import json
          for path in (".github/release/artifact-policy.json", "release/manifest.schema.json"):
              json.load(open(path, encoding="utf-8"))
          PY
      - name: Download every release artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: release-*-${{ needs.release-gate.outputs.tag }}
          path: release-inputs
          merge-multiple: true
      - name: Verify manifests and artifact hashes
        env:
          BUILT_TARGETS: ${{ needs.setup.outputs.targets }}
          EXPECTED_SOURCE_REVISION: ${{ needs.release-gate.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release-inputs.sh release-inputs \
            "$BUILT_TARGETS" "$EXPECTED_SOURCE_REVISION"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-gate.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open(".github/release/artifact-policy.json"))["manifest_contract"]["chromium_version"])')"
          gh release create "$RELEASE_TAG" release-inputs/* --verify-tag \
            --title "Apostate $RELEASE_TAG" \
            --notes "Apostate artifacts for Chromium $version. Verify provenance with: gh attestation verify <artifact> --repo $REPOSITORY"
