name: test suite

# The offline tier of tests/ against the released browser, on Linux x64, plus
# the MCP server's test. It downloads the browser named by the package's
# manifest, so it checks what users install, not a local build. A dispatch
# with nightly_run tests that nightly run's linux-x64 archive instead, which
# is how a Chromium update is tested before its release exists. The live tier
# does not run here: hosted runners exit from datacenter addresses.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_run:
        description: "A nightly builds run id whose linux-x64 archive to test instead of the release"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  offline:
    name: offline tier, linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use a nightly build
        if: ${{ inputs.nightly_run != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RUN: ${{ inputs.nightly_run }}
        run: |
          set -euo pipefail
          gh run download "$NIGHTLY_RUN" -R "$GITHUB_REPOSITORY" -p 'nightly-linux-x64-*' -D "$RUNNER_TEMP/nightly"
          archive="$(find "$RUNNER_TEMP/nightly" -name 'apostate-*-linux-x64.tar.zst' | head -1)"
          [ -n "$archive" ] || { echo "run $NIGHTLY_RUN has no linux-x64 archive" >&2; exit 1; }
          (cd "$(dirname "$archive")" && sha256sum -c <(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["sha256"]+"  "+m["artifact"])' "$archive.manifest.json"))
          mkdir -p "$RUNNER_TEMP/browser"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/browser"
          echo "APOSTATE_BINARY=$(find "$RUNNER_TEMP/browser" -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"
      - name: Install the package, pytest and the browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install ./python pytest zstandard
          [ -n "${APOSTATE_BINARY:-}" ] || "$RUNNER_TEMP/venv/bin/apostate" install
          "$RUNNER_TEMP/venv/bin/apostate" fonts install windows
      - name: Run the offline tier
        shell: bash
        working-directory: tests
        run: |
          set -euo pipefail
          python3 -m pytest -q -rfEx --network="GitHub-hosted runner" --results="$RUNNER_TEMP/results-linux-x64.json"
      - name: Keep the results file
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-suite-results-linux-x64
          path: ${{ runner.temp }}/results-linux-x64.json
          if-no-files-found: ignore

  mcp:
    name: MCP server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Use a nightly build
        if: ${{ inputs.nightly_run != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RUN: ${{ inputs.nightly_run }}
        run: |
          set -euo pipefail
          gh run download "$NIGHTLY_RUN" -R "$GITHUB_REPOSITORY" -p 'nightly-linux-x64-*' -D "$RUNNER_TEMP/nightly"
          archive="$(find "$RUNNER_TEMP/nightly" -name 'apostate-*-linux-x64.tar.zst' | head -1)"
          [ -n "$archive" ] || { echo "run $NIGHTLY_RUN has no linux-x64 archive" >&2; exit 1; }
          (cd "$(dirname "$archive")" && sha256sum -c <(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["sha256"]+"  "+m["artifact"])' "$archive.manifest.json"))
          mkdir -p "$RUNNER_TEMP/browser"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/browser"
          echo "APOSTATE_BINARY=$(find "$RUNNER_TEMP/browser" -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"
      - name: Install and test
        shell: bash
        working-directory: mcp
        run: |
          set -euo pipefail
          npm ci
          [ -n "${APOSTATE_BINARY:-}" ] || npx apostate install
          npm test
