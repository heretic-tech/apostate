name: test suite

# The offline tier of tests/ against the released browser, on Linux x64, plus
# the MCP server's test. It downloads the browser named by the package's
# manifest, so it checks what users install, not a local build. The live tier
# does not run here: hosted runners exit from datacenter addresses.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline tier, linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the package, pytest and the browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install ./python pytest zstandard
          "$RUNNER_TEMP/venv/bin/apostate" install
          "$RUNNER_TEMP/venv/bin/apostate" fonts install windows
      - name: Run the offline tier
        shell: bash
        working-directory: tests
        run: |
          set -euo pipefail
          python3 -m pytest -q -rfEx --network="GitHub-hosted runner" --results="$RUNNER_TEMP/results-linux-x64.json"
      - name: Keep the results file
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-suite-results-linux-x64
          path: ${{ runner.temp }}/results-linux-x64.json
          if-no-files-found: ignore

  mcp:
    name: MCP server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install and test
        shell: bash
        working-directory: mcp
        run: |
          set -euo pipefail
          npm ci
          npx apostate install
          npm test
